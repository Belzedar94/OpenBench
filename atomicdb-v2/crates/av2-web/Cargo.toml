[package]
name = "av2-web"
description = "AtomicDB v2: the website, server-side rendered by Leptos inside the graph's binary, WASM islands for the interactive parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the WASM bundle of the islands (cargo leptos / wasm-bindgen);
# rlib: the server links the pages and islands as a library.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "av2-web"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
# The server: pages, fixture store, HTTP, Django session bridge.
ssr = [
    "leptos/ssr",
    "dep:av2-model",
    "dep:axum",
    "dep:base64",
    "dep:brotli",
    "dep:flate2",
    "dep:hmac",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:tower",
    "dep:xxhash-rust",
]
# The browser: only the islands are compiled in.
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies]
leptos = { version = "0.8.23", features = ["islands"] }
serde = { workspace = true }

# ssr
av2-model = { workspace = true, optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "http2", "tokio", "query", "json"] }
base64 = { version = "0.22", optional = true }
brotli = { version = "8", optional = true }
flate2 = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
rusqlite = { version = "0.43.0", optional = true, features = ["bundled"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal"] }
tower = { version = "0.5", optional = true, features = ["util"] }
xxhash-rust = { workspace = true, optional = true }

# hydrate
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CustomEvent",
    "Document",
    "DomTokenList",
    "Element",
    "Headers",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "PageTransitionEvent",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "UrlSearchParams",
    "Window",
] }

[package.metadata.leptos]
# `cargo leptos build --release` from atomicdb-v2/ (see docs/web.md).
output-name = "av2_web"
site-root = "target/site"
site-pkg-dir = "static/atomicdb/pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
env = "PROD"
