[workspace]
resolver = "3"
members = [
    "crates/av2-model",
    "crates/av2-facts",
    "crates/av2-store",
    "crates/av2-rules",
    "crates/av2-tools",
    "crates/av2-compat",
    "crates/av2-proof",
    "crates/av2-queue",
    "crates/av2-server",
    "bench",
]
# `cargo build` / `cargo test` at the root build the v2 crates only.  The bench
# links RocksDB, LMDB, SQLite and Postgres (RocksDB needs libclang): build it
# explicitly with `cargo build --release -p atomicdb-v2-bench`.
default-members = [
    "crates/av2-model",
    "crates/av2-facts",
    "crates/av2-store",
    "crates/av2-rules",
    "crates/av2-tools",
    "crates/av2-compat",
    "crates/av2-proof",
    "crates/av2-queue",
    "crates/av2-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
av2-model = { path = "crates/av2-model" }
av2-facts = { path = "crates/av2-facts" }
av2-store = { path = "crates/av2-store" }
av2-rules = { path = "crates/av2-rules" }
arc-swap = "1.7"
crc32fast = "1.5.6"
csv = "1.3"
flate2 = "1"
hex = "0.4"
memmap2 = "0.9.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
ruzstd = "0.8"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

# Tests exercise the store with real files; keep them reasonably fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
