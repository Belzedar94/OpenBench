# Drop-in for EACH ingest unit (atomicdb-ingest, atomicdb-ingest2 .. 5):
#
#     /etc/systemd/system/atomicdb-ingest.service.d/80-defer-propagation.conf
#     /etc/systemd/system/atomicdb-ingest2.service.d/80-defer-propagation.conf
#     ...
#
# Only after atomicdb-propagate.service is enabled and running.  Then:
#
#     sudo systemctl daemon-reload
#     sudo systemctl restart atomicdb-ingest atomicdb-ingest2 \
#         atomicdb-ingest3 atomicdb-ingest4 atomicdb-ingest5
#
# Rollback: delete these files, daemon-reload, restart the ingest units.
# They climb inline again and drain any rows left in the queue themselves;
# atomicdb-propagate can then be stopped once
# `manage.py process_propagation --status` reports 0 waiting.
#
# Leave the web unit (openbench) without it: with ATOMICDB_SYNCHRONOUS_INGEST
# the web process applies submits itself and always climbs inline anyway.

[Service]
Environment=ATOMICDB_DEFER_PROPAGATION=1
