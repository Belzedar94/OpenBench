# /etc/nginx/conf.d/atomicdb-timing.conf  (http context, included by nginx.conf)
#
# A second access log with request times, for the AtomicDB v1 baseline
# (Scripts/atomicdb_perf_sample.py reads it every minute).  The main
# access.log keeps the stock "combined" format and is not touched.  Only
# /atomicdb/ requests are logged, without the query string (no FENs, no
# tokens), about 60 bytes a line; logrotate's /var/log/nginx/*.log rule
# rotates and compresses it daily like the others.
#
# Fields, "|"-separated: epoch with ms, status, request_time (s, the client's
# view), upstream_response_time (s, Django's; "-" when nginx answered
# itself, comma separated when it tried several upstreams), method, path.
#
#     sudo cp nginx-atomicdb-timing.conf /etc/nginx/conf.d/atomicdb-timing.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# Rollback: delete the file, nginx -t, reload.
#
# Caveat: a server or location block with its own access_log directive does
# not inherit this one (nginx replaces, not merges, access_log per level).

map $uri $atomicdb_timed {
    ~^/atomicdb/  1;
    default       0;
}

log_format atomicdb_timing '$msec|$status|$request_time|$upstream_response_time|$request_method|$uri';

access_log /var/log/nginx/atomicdb-timing.log atomicdb_timing if=$atomicdb_timed;
