# Drop-in for the drainer and EACH ingest unit, to record golden cases for
# AtomicDB v2 (atomicdb/golden_cases.py, docs/atomicdb/v2-plan.md 7.2):
#
#     /etc/systemd/system/atomicdb-propagate.service.d/91-golden.conf
#     /etc/systemd/system/atomicdb-ingest.service.d/91-golden.conf
#     ...
#
# Off unless ATOMICDB_GOLDEN_CASES is set.  The rate is a fraction of the
# batches (drain) and of the jobs (stage_a); it can be changed later without
# a restart in /var/lib/atomicdb-golden/control.json, e.g.
#     {"enabled": true, "rate": {"drain": 0.05, "stage_a": 0.01}}
# Output: /var/lib/atomicdb-golden/<kind>/*.jsonl.zst (needs the zstd
# command; gzip otherwise), rotated every ROTATE_MB of JSON, hard cap MAX_GB
# over the directory, nothing written while the disk has less than
# MIN_FREE_GB free.  Counters per process in status-<host>-<pid>.json.
#
#     sudo systemctl daemon-reload
#     sudo systemctl restart atomicdb-propagate atomicdb-ingest ...
#
# Rollback: {"enabled": false} in control.json (immediate, within 30 s), or
# delete the drop-ins, daemon-reload and restart the units.

[Service]
Environment=ATOMICDB_GOLDEN_CASES=1
Environment=ATOMICDB_GOLDEN_DIR=/var/lib/atomicdb-golden
Environment=ATOMICDB_GOLDEN_RATE=0.01
Environment=ATOMICDB_GOLDEN_MAX_GB=20
Environment=ATOMICDB_GOLDEN_MIN_FREE_GB=300
Environment=ATOMICDB_GOLDEN_ROTATE_MB=256
