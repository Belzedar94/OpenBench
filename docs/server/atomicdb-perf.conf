# Drop-in for the drainer and EACH ingest unit:
#
#     /etc/systemd/system/atomicdb-propagate.service.d/90-perf.conf
#     /etc/systemd/system/atomicdb-ingest.service.d/90-perf.conf
#     /etc/systemd/system/atomicdb-ingest2.service.d/90-perf.conf
#     ...
#
# Each climbed batch and each applied job then appends one short JSON line to
# /var/lib/atomicdb-perf/events-YYYYMMDD.jsonl (atomicdb/perf_events.py),
# which atomicdb-perf-sample reads every minute.  The directory must exist;
# without it, or without this drop-in, nothing is written.
#
#     sudo systemctl daemon-reload
#     sudo systemctl restart atomicdb-propagate atomicdb-ingest ...
#
# Rollback: delete the files, daemon-reload, restart the same units.

[Service]
Environment=ATOMICDB_PERF_DIR=/var/lib/atomicdb-perf
