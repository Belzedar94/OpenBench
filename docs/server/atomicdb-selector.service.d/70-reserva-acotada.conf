# 11-oct-2026, 08:15 UTC. EMERGENCIA, pendiente de que el propietario la
# ratifique o la quite. Con la cola de peticiones vacia la reserva acunaba
# 512 tareas AUTO de 8M por pasada; la flota las termina en segundos y la
# ingesta escribe ~1 resultado por segundo: llegaban 2 por segundo, la cola
# de escritura crecia 300 cada 5 minutos (2.581 pendientes, 21 min de espera
# y subiendo) y api/lease acaba dando timeout a los workers, como a las 06:00
# de hoy y el 8-oct. Con 64 por pasada el caudal queda por debajo de lo que
# la ingesta aguanta. No toca prioridades, ni el arbol, ni como se sirven las
# peticiones de usuarios: solo cuantas tareas automaticas se acunan.
# Para quitarla: borrar este fichero, `systemctl daemon-reload` y
# `systemctl restart atomicdb-selector`.
[Service]
ExecStart=
ExecStart=/opt/openbench/.venv/bin/python manage.py refresh_selector --loop --interval 120 --no-priorities --no-coverage --no-adversarial --autosolve-cap 0 --pool-target 64
