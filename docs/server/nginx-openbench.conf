# Reference copy of the nginx site that fronts the permanent service
# (/etc/nginx/sites-available/openbench). The directives are the live ones;
# comments are translated and lines that belong to other sites on the same
# host are left out. Change the server first, then this file in the same turn.

# A crawler that walks the move tree never finishes: every move is a new URL
# (?play= grows without bound) and each one costs half a second of CPU. On
# 30 July 2026 GPTBot alone made 94% of the pages the site rendered.
# robots.txt tells the ones that obey where not to go; this limit is for the
# rest and for the ones slow to re-read it. 429 means "come back later", not a
# slammed door: polite crawlers slow down by themselves.
map $http_user_agent $atomicdb_crawler {
    default                                     '';
    # 5 October 2026: Meta's AI crawler was not on the list and was rendering
    # 94% of the tree pages (381,000 of 406,000 in 38 hours, about 3 a second
    # around the clock from 43 addresses, ignoring the Disallow on
    # /atomicdb/goto/). It gets a bucket of its own, so its rejections do not
    # take the turn of the crawlers that respect Crawl-delay. Link previews
    # (facebookexternalhit) are left alone.
    "~*(meta-externalagent|meta-webindexer)"    meta;
    "~*(GPTBot|ClaudeBot|CCBot|Bytespider|PerplexityBot|Amazonbot|Applebot|SemrushBot|AhrefsBot|DataForSeoBot|MJ12bot|DotBot)"  crawler;
}

limit_req_zone $atomicdb_crawler zone=crawlers:1m rate=6r/m;

# The scriptable API, per client address. Measured on 4-5 October 2026: one
# client made 91% of the 901,000 queries of 38 hours (17 a second sustained,
# peaks of 52) and another reached 247 a second, and the whole site waited
# behind them. 5 a second sustained with a burst of 50 is far above a person
# with the explorer open, which polls every 10 to 20 seconds.
limit_req_zone $binary_remote_addr zone=atomicdb_api:10m rate=5r/s;

server {
    server_name belzedar.duckdns.org;
    client_max_body_size 2g;
    client_body_timeout 900s;
    send_timeout 900s;

    # nginx ships `gzip on` with the default types, which are text/html only:
    # the 45 kB stylesheet travelled uncompressed.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Our own static files carry ?v=<mtime> in the template, so a deployment
    # changes their URL and the browser fetches them anyway: caching them for
    # long is safe. Third-party ones (chessground) never change.
    location /static/ {
        alias /opt/openbench/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/  { alias /opt/openbench/Media/; }
    location /atomicdb/engines/ { alias /var/www/atomicdb-engines/; }
    location = /robots.txt { alias /var/www/robots.txt; }

    # The infinite space: browsing the tree. People never touch the limit
    # (their $atomicdb_crawler is the empty string, which the zone ignores).
    location ~ ^/atomicdb/(goto|explore)/ {
        limit_req zone=crawlers burst=12 nodelay;
        limit_req_status 429;
        # Without this every rejection writes a line to error.log, about
        # 260,000 a day with Meta. The 429 is in access.log already.
        limit_req_log_level warn;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # The endpoints a script can hammer. The worker ones (lease, heartbeat,
    # submit, solve/*) do not match and stay unlimited through `location /`:
    # a contributor with many threads behind one address is legitimate.
    location ~ ^/atomicdb/api/(query|request|live-request|frontier|my-queue|queue-bump|queue-cancel|map)(/|$) {
        limit_req zone=atomicdb_api burst=50 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @atomicdb_api_429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    location @atomicdb_api_429 {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"status":"rate-limited","detail":"Too many requests from this address. The API allows 5 requests/second (bursts up to 50). Wait a moment and retry."}\n';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/belzedar.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belzedar.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = belzedar.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name belzedar.duckdns.org;
    return 404; # managed by Certbot
}
