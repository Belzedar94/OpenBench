<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AtomicDB{% endblock %}</title>
<style>
:root{
  --bg:#161512;--panel:#211f1c;--panel2:#2a2723;--text:#d8d4cf;--dim:#8f8a83;
  --won:#629924;--lost:#cc3333;--draw:#4a90d9;--hot:#e8a33d;--warm:#b8862f;--cold:#565049;
  --sq-l:#f0d9b5;--sq-d:#b58863;--accent:#7fa650;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:baseline;gap:1.2rem;padding:.9rem 1.4rem;
  background:var(--panel);border-bottom:1px solid #3a362f}
header h1{font-size:1.25rem;letter-spacing:.5px}
header h1 span{color:var(--hot)}
header nav a{margin-right:1rem;color:var(--dim)}
header nav a:hover{color:var(--text)}
main{max-width:1100px;margin:1.4rem auto;padding:0 1.2rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:.8rem;margin:1rem 0 1.6rem}
.metric{background:var(--panel);border:1px solid #3a362f;border-radius:8px;
  padding:.7rem 1rem;text-align:center}
.metric .v{font-size:1.7rem;font-weight:600}
.metric .l{color:var(--dim);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.6rem}
.tile{border-radius:8px;padding:.55rem .6rem;border:1px solid #3a362f;
  background:var(--panel2);transition:transform .08s}
.tile:hover{transform:translateY(-2px);text-decoration:none}
.tile .mv{font-weight:700;font-size:1.05rem;color:var(--text)}
.tile .ev{font-size:.85rem;color:var(--dim)}
.tile.won{background:linear-gradient(160deg,#2c4d12,#1d3309);border-color:var(--won)}
.tile.lost{background:linear-gradient(160deg,#5a1717,#3b0e0e);border-color:var(--lost)}
.tile.draw{border-color:var(--draw)}
.tile.hot{border-color:var(--hot);background:linear-gradient(160deg,#4a3413,#2e2009)}
.tile.warm{border-color:var(--warm)}
.chip{display:inline-block;min-width:12px;height:12px;border-radius:50%;margin-right:.45rem}
.chip.won{background:var(--won)}.chip.lost{background:var(--lost)}
.chip.draw{background:var(--draw)}.chip.hot{background:var(--hot)}
.chip.warm{background:var(--warm)}.chip.cold{background:var(--cold)}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:1px;
  text-align:left;padding:.45rem .6rem;border-bottom:1px solid #3a362f}
td{padding:.5rem .6rem;border-bottom:1px solid #2c2925}
tr:hover td{background:var(--panel2)}
.boardwrap{position:relative;width:min(440px,92vw)}
.board{display:grid;grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);width:100%;
  aspect-ratio:1;border-radius:6px;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.5)}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq img{width:88%;height:88%;display:block}
.coord{position:absolute;font-size:.62rem;font-weight:700;opacity:.75;
  pointer-events:none}
.coord.file{right:3px;bottom:1px}
.coord.rank{left:3px;top:1px}
.sq.l .coord{color:var(--sq-d)}.sq.d .coord{color:var(--sq-l)}
.cols{display:grid;grid-template-columns:auto 1fr;gap:1.6rem;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.verdict{padding:.5rem .9rem;border-radius:8px;background:var(--panel);
  border:1px solid #3a362f;margin:.8rem 0;font-weight:600}
.verdict.won{border-color:var(--won)}.verdict.lost{border-color:var(--lost)}
.feed{list-style:none}
.feed li{padding:.45rem .2rem;border-bottom:1px solid #2c2925;font-size:.92rem}
.feed .t{color:var(--dim);font-size:.8rem;margin-right:.6rem}
h2{margin:1.6rem 0 .7rem;font-size:1.1rem}
.dim{color:var(--dim)}
.crumb{font-size:.9rem;color:var(--dim);margin-bottom:.6rem}
footer{margin:3rem 0 1rem;text-align:center;color:var(--dim);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1><a href="/atomicdb/" style="color:inherit">Atomic<span>DB</span></a></h1>
  <nav>
    <a href="/atomicdb/">Map</a>
    <a href="/atomicdb/walls/">Walls</a>
    <a href="/atomicdb/method/">Method</a>
    <a href="/index/">OpenBench</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>AtomicDB, a practical solving effort for Atomic Chess. Results are
  labeled "practical", not game-theoretic certificates. Piece set: cburnett
  (lichess), CC BY-SA.</footer>
</body>
</html>
