name: DATAGEN PostgreSQL + AtomicDB split

on:
  pull_request:
  push:
    branches: [spell-runner]

jobs:
  # Keep the established PostgreSQL/default-database job as the compatibility
  # contract.  With no authenticated split receipt, AtomicDB stays on default.
  datagen-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openbench_test
          POSTGRES_USER: openbench
          POSTGRES_PASSWORD: openbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbench -d openbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENBENCH_POSTGRES_DB: openbench_test
      OPENBENCH_POSTGRES_USER: openbench
      OPENBENCH_POSTGRES_PASSWORD: openbench
      OPENBENCH_POSTGRES_HOST: 127.0.0.1
      OPENBENCH_POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r Client/requirements.txt
      - run: python -c "import cpuinfo, psutil, requests"
      - run: python manage.py migrate --noinput
      - run: python manage.py test OpenBench.tests.test_datagen_mode --verbosity 2
      # Discovery, not a hand-listed module: naming one file meant every other
      # client test in UnitTests/ was dead weight, and a new one would have
      # been too. Any test_*.py added here runs from now on.
      - run: python -m unittest discover -s UnitTests -t UnitTests -v
      - run: python manage.py test atomicdb --verbosity 2
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check

  atomicdb-split-sqlite:
    name: AtomicDB staged SQLite split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r Client/requirements.txt
      - run: python -c "import cpuinfo, psutil, requests"

      - name: Migrate the compatibility database
        run: |
          python manage.py migrate --database default --noinput
          python manage.py shell -c \
            "from django.conf import settings; assert settings.ATOMICDB_DATABASE_ALIAS == 'default'"

      - name: Seed minimal legacy AtomicDB state
        run: |
          python manage.py shell -c \
            "from atomicdb import ingest, logic; ingest.get_or_create_position(logic.start_fen())"

      - name: Perform the offline split into the temporary checkout
        run: |
          test ! -e "$GITHUB_WORKSPACE/atomicdb.sqlite3"
          test ! -e "$GITHUB_WORKSPACE/atomicdb.sqlite3.split-receipt.json"
          python manage.py split_atomicdb_sqlite \
            --offline-confirmed \
            --destination "$GITHUB_WORKSPACE/atomicdb.sqlite3"

      - name: Authenticate, migrate, and re-authenticate the split database
        run: |
          python manage.py shell -c \
            "from django.conf import settings; assert settings.ATOMICDB_DATABASE_ALIAS == 'atomicdb'"
          python manage.py verify_atomicdb_database \
            --allow-pending-migrations
          python manage.py migrate atomicdb \
            --database atomicdb --noinput
          python manage.py verify_atomicdb_database

      - name: Confirm split placement and retained rollback tables
        run: |
          python manage.py shell -c \
            "from django.db import connections; \
            d = connections['default'].cursor(); \
            a = connections['atomicdb'].cursor(); \
            d.execute('SELECT COUNT(*) FROM atomicdb_position'); \
            a.execute('SELECT COUNT(*) FROM atomicdb_position'); \
            assert d.fetchone()[0] == 1; \
            assert a.fetchone()[0] == 1"

      - run: python manage.py test atomicdb --verbosity 2
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
